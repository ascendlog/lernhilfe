<html lang="de">

<title>Lernhilfe</title>

<style>
/* Designsystem: Jede Person hat ihren eigenen „Raum“ (Farbton + Akzent). Neutrale Flächen leiten sich aus --h ab. */
:root{--h:228;--bg:hsl(var(--h) 34% 8%);--chrome:hsl(var(--h) 32% 10%);--surface:hsl(var(--h) 27% 13%);--surface-2:hsl(var(--h) 25% 18%);--line:hsl(var(--h) 21% 25%);--ink:hsl(var(--h) 50% 96%);--muted:hsl(var(--h) 16% 71%);--accent:#ffc233;--accent-text:#ffc233;--on-accent:#1d1500;--ok:#3ccf82;--bad:#ff7d72;--part:#f3b43f;--shadow:0 18px 40px -18px rgba(2,4,14,.85);--display:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Inter Display",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
html[data-p=saskia]{--h:176;--accent:#2fd0b9;--accent-text:#2fd0b9;--on-accent:#03201b}
html[data-p=dario]{--h:268;--accent:#b794ff;--accent-text:#b794ff;--on-accent:#1b0f38}
html[data-theme=light]{color-scheme:light;--bg:hsl(var(--h) 38% 96%);--chrome:#fff;--surface:#fff;--surface-2:hsl(var(--h) 36% 95%);--line:hsl(var(--h) 24% 86%);--ink:hsl(var(--h) 42% 12%);--muted:hsl(var(--h) 12% 38%);--accent-text:#7d5000;--ok:#117a47;--bad:#c1372b;--part:#8f5b00;--shadow:0 16px 36px -18px hsl(var(--h) 40% 25% / .35)}
html[data-theme=light][data-p=saskia]{--accent-text:#09665b}
html[data-theme=light][data-p=dario]{--accent-text:#5a2fb3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}
h1{font:700 clamp(2rem,5vw,3rem)/1.05 var(--display);letter-spacing:.005em}
h2{font-size:1.2rem;font-weight:700}
p{margin:.4rem 0 .8rem}
ul,ol{margin:.3rem 0 .8rem;padding-left:1.3rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--chrome) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:.55rem 1.2rem;display:flex;align-items:center;gap:.6rem}
.brand{display:inline-flex;align-items:center;gap:.55rem;font:700 1.3rem/1 var(--display);background:none;border:0;color:var(--ink);cursor:pointer;padding:.25rem .35rem;border-radius:10px;white-space:nowrap}
.brand svg{width:1.7rem;height:1.7rem;flex:none}
.crumb{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp{flex:1}
main{max-width:1040px;margin:0 auto;padding:1.4rem 1.2rem 4rem;outline:none}
.col{max-width:780px;margin:0 auto}
.muted{color:var(--muted)}
.center{text-align:center}
.hero{display:flex;flex-wrap:wrap;gap:1rem 2.5rem;align-items:flex-end;justify-content:space-between;margin:.5rem 0 1.6rem}
.hero h1{margin:0 0 .35rem}
.lead{font-size:1.05rem;color:var(--muted);margin:0}
.stats{display:flex;gap:1.8rem}
.stat b{display:block;font:700 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.35rem;margin:0 0 1rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;margin:0 0 1.4rem}
.btn{font:inherit;font-weight:650;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:.62rem 1.15rem;border-radius:10px;cursor:pointer;transition:filter .12s,border-color .12s,background .12s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.sec{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.btn.sec:hover:not(:disabled){border-color:var(--accent);filter:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--ink);filter:none}
.btn.sm{padding:.34rem .75rem;font-size:.88rem;border-radius:9px}
.btn.icon{padding:.34rem .5rem;display:inline-flex;align-items:center}
.btn.icon svg{width:1.15rem;height:1.15rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{font:inherit;background:none;border:0;color:var(--accent-text);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.4rem}
.chip{font-size:.8rem;font-weight:600;padding:.1rem .6rem;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.note{background:color-mix(in srgb,var(--part) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--part) 28%,var(--line));border-radius:10px;padding:.5rem .8rem;font-size:.9rem;color:var(--muted)}
.resume{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.legend{font-size:.85rem;color:var(--muted)}
.meta{display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:.92rem;margin-bottom:.7rem;flex-wrap:wrap}
.segs{display:flex;gap:2px;margin:0 0 1rem}
.segs i{flex:1;min-width:1px;height:6px;border-radius:4px;background:var(--surface-2);transition:background .2s}
.segs i.done{background:color-mix(in srgb,var(--accent) 50%,var(--surface-2))}
.segs i.cur{background:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.segs i.ok,.segs i.cur.ok{background:var(--ok)}
.segs i.part,.segs i.cur.part{background:var(--part)}
.segs i.bad,.segs i.cur.bad{background:var(--bad)}
.sect{font-size:.9rem;font-weight:700;color:var(--accent-text);margin-bottom:.35rem}
.q{font-size:1.25rem;font-weight:650;line-height:1.4;margin:0 0 .9rem}
.q p{margin:0 0 .4rem}
.task{padding:1.5rem 1.6rem}
.lesetext{background:var(--surface-2);border-radius:12px;padding:.7rem 1.1rem;margin:0 0 1rem}
.lesetext p{margin:.3rem 0}
.bild{display:block;max-width:100%;max-height:420px;margin:.2rem auto 1rem;border-radius:10px;border:1px solid var(--line);background:#fff}
.listen{margin:0 0 1rem}
.listen .row{margin-bottom:.4rem}
.script{font-size:.92rem;background:var(--surface-2);border-radius:10px;padding:.4rem .8rem}
.script summary{cursor:pointer;color:var(--muted)}
.opts{display:grid;gap:.55rem}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;gap:.85rem;align-items:center;padding:.75rem .95rem;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 65%,var(--line))}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.ltr{flex:none;width:2rem;height:2rem;border-radius:9px;display:grid;place-items:center;font:700 .95rem/1 var(--display);background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.opt:has(input:checked) .ltr{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:#06210f}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad);color:#2a0a07}
.opt.miss{border-color:var(--ok);border-style:dashed;background:var(--surface)}
.hintline{color:var(--muted);font-size:.9rem;margin:0 0 .5rem}
.txt,.area,.gap,.sel{font:inherit;color:var(--ink)}
.kurz{display:flex;align-items:center;gap:.6rem}
input.txt{width:100%;max-width:30rem;padding:.6rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2)}
.area{width:100%;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);resize:vertical}
.txt:focus,.area:focus{border-color:var(--accent);outline:none}
.unit{color:var(--muted)}
.gaptext{font-size:1.1rem;line-height:2.5}
.gap{border:0;border-bottom:2px solid var(--accent);background:var(--surface-2);padding:.1rem .4rem;border-radius:6px 6px 0 0;text-align:center;font-size:1.05rem}
select.gap{text-align:left;padding:.1rem .2rem}
.gap:focus{outline:none;background:var(--surface)}
.bank{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.bank span{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:.1rem .6rem;font-size:.95rem}
button.gap{font:inherit;font-size:1.05rem;color:var(--ink);cursor:pointer;min-width:5.5ch;min-height:2.5rem;padding:.2rem .7rem;vertical-align:middle;line-height:1.3}
button.gap.filled{touch-action:none;-webkit-user-select:none;user-select:none}
button.gap.act{background:color-mix(in srgb,var(--accent) 20%,var(--surface));box-shadow:0 0 0 2px var(--accent)}
button.gap.over{background:color-mix(in srgb,var(--accent) 34%,var(--surface));box-shadow:0 0 0 3px var(--accent)}
.bank.live{gap:.55rem;margin:.9rem 0 .3rem;padding:.7rem;border:1px dashed var(--line);border-radius:12px}
.wchip{font:inherit;font-size:1.05rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:.45rem .9rem;min-height:2.75rem;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wchip:hover:not(:disabled){border-color:var(--accent)}
.wchip.used{opacity:.55}
.wchip:disabled{cursor:default;opacity:.6}
.wghost{position:fixed;z-index:1000;pointer-events:none;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:.45rem .9rem;font-size:1.05rem;font-weight:600;box-shadow:var(--shadow);transform:translate(-50%,-50%)}
.modeline{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:.2rem}
.ok{border-color:var(--ok)!important}
strong.bad{color:var(--bad)}
.bad{border-color:var(--bad)!important}
input.ok,select.ok,.gap.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
input.bad,select.bad,.gap.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.pairs{display:grid;gap:.5rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;align-items:center}
.sel{padding:.5rem .6rem;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);width:100%}
.order{list-style:none;padding:0;margin:0;display:grid;gap:.5rem;counter-reset:o}
.order li{counter-increment:o;display:flex;align-items:center;gap:.7rem;border:1.5px solid var(--line);border-radius:12px;padding:.5rem .8rem;background:var(--surface)}
.order li::before{content:counter(o);font:700 1.1rem/1 var(--display);color:var(--accent-text);width:1.4rem}
.order li.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.order li.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.order .txt{flex:1}
.mv{display:flex;gap:.3rem}
.mini{font:inherit;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;width:2.2rem;height:2rem;cursor:pointer}
.mini:hover:not(:disabled){border-color:var(--accent)}
.mini:disabled{opacity:.3;cursor:default}
.fb{margin-top:1rem;border-radius:12px;padding:.8rem 1rem;border:1.5px solid var(--line)}
.fb.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.fb.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:var(--bad)}
.fb.part{background:color-mix(in srgb,var(--part) 13%,var(--surface));border-color:var(--part)}
.fb.neutral{background:var(--surface-2)}
.fb h3{font-size:1.05rem;margin:0 0 .3rem}
.fb p{margin:.3rem 0}
.fill{background:color-mix(in srgb,var(--ok) 20%,transparent);border-radius:5px;padding:0 .3rem}
.sol{margin:.3rem 0}
.rate{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 .2rem}
.rate .btn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.nav{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.3rem;align-items:center}
.jump{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1rem}
.dot{font:700 .85rem/1 var(--display);width:2.1rem;height:2.1rem;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.dot.done{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.dot.cur{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.score{display:flex;flex-direction:column;align-items:center;text-align:center;padding:1.8rem 1.4rem}
.ringbox{position:relative;width:11rem;height:11rem;margin-bottom:.8rem}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .trk{stroke:var(--surface-2)}
.ring .val{stroke:var(--rc,var(--accent));stroke-linecap:round;transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.ringbox .big{position:absolute;inset:0;display:grid;place-items:center;font:700 2.7rem/1 var(--display);font-variant-numeric:tabular-nums}
details.rrow{border:1px solid var(--line);border-radius:12px;margin:0 0 .6rem;background:var(--surface)}
details.rrow summary{cursor:pointer;padding:.6rem .9rem;display:flex;gap:.6rem;align-items:center}
details.rrow summary>.t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.rrow .body{padding:.2rem 1rem 1rem}
.badge{font-weight:800;width:1.5rem;text-align:center}
.st-ok .badge{color:var(--ok)}.st-bad .badge{color:var(--bad)}.st-part .badge{color:var(--part)}
.pts{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.kv{margin:.3rem 0}
.kv b{display:inline-block;min-width:8.5rem;color:var(--muted);font-weight:650}
dialog{border:1px solid var(--line);border-radius:20px;padding:0;background:var(--surface);color:var(--ink);max-width:min(640px,94vw);width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(5,8,20,.62);backdrop-filter:blur(3px)}
.dlg-in{padding:1.3rem 1.5rem}
.dlg-in textarea{width:100%;min-height:12rem;font:.85rem/1.4 ui-monospace,Consolas,monospace;padding:.6rem;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.errs{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-radius:10px;padding:.5rem .9rem;font-size:.92rem}
.errs ul{margin:.2rem 0}
code{background:var(--surface-2);border-radius:6px;padding:.05rem .35rem;font-size:.9em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.codewrap{margin:.6rem 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.codebar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.2rem .35rem .2rem .8rem;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.codebar .codecopy{min-height:0;padding:.25rem .7rem}
pre.code{margin:0;padding:.7rem .9rem;overflow-x:auto;max-width:100%;font:.88rem/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2;white-space:pre}
pre.code code{background:none;padding:0;border-radius:0;font:inherit}
.codewrap.out{background:var(--bg)}
.codewrap.out pre.code{color:var(--muted)}
.lib{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line)}
.libhead{display:flex;width:100%;gap:.5rem;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;font-weight:700;text-align:left;padding:.7rem 0;cursor:pointer}
.libhead .muted{font-weight:400}
.libgrp{margin-top:1.2rem}
.libsub{margin-left:1rem}
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:20;font-size:.95rem}
#toast.on{opacity:1;transform:translateX(-50%)}
.dropping::after{content:"Datei hier loslassen";position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 18%,transparent);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:var(--accent-text);pointer-events:none;border:4px dashed var(--accent);z-index:30}
.blatt h2{color:var(--accent-text)}
.lesenbox{margin-top:.7rem}
details.lesen{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:.4rem 0}
details.lesen summary{display:block;cursor:pointer;padding:.55rem .85rem;overflow-wrap:anywhere}
.lesen-body{padding:.1rem .95rem .8rem}
.lesen-body .bild{max-height:300px}
.lesen-q{font-size:.92rem}
.merke{background:color-mix(in srgb,var(--accent) 11%,var(--surface));border-radius:10px;padding:.55rem .95rem;margin-top:.7rem}
.merke p{margin:.2rem 0}
/* Auswahl „Wer lernt?“ */
.who-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem;margin-top:1.4rem}
.who{--ph:228;--pa:#ffc233;position:relative;overflow:hidden;isolation:isolate;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;font:inherit;color:var(--ink);text-align:left;padding:1.4rem 1.6rem;border-radius:22px;border:1.5px solid hsl(var(--ph) 24% 27%);background:hsl(var(--ph) 32% 15%);cursor:pointer;transition:transform .15s,border-color .15s}
html[data-theme=light] .who{background:hsl(var(--ph) 55% 95%);border-color:hsl(var(--ph) 30% 82%)}
.who:hover{transform:translateY(-3px);border-color:var(--pa)}
.who .ini{position:absolute;right:-.4rem;top:-2.4rem;font:800 13rem/1 var(--display);color:color-mix(in srgb,var(--pa) 15%,transparent);z-index:-1;user-select:none;pointer-events:none}
.who .nm{display:block;font:700 2.2rem/1.1 var(--display)}
.who .info{display:block;color:var(--muted);font-size:.95rem}
.av{flex:none;width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;font:700 1.3rem/1 var(--display);color:var(--on-accent);background:var(--c,var(--accent))}
.pill{display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap}
.pill .av{width:1.55rem;height:1.55rem;font-size:.85rem}
/* Paketkarten */
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:1rem}
.packs .card{margin:0}
.pgroup{margin-top:2.2rem;padding-top:1.3rem;border-top:1px solid var(--line)}
.pghead{margin:0 0 1rem}
.toolbar + .pgroup{margin-top:1.4rem;padding-top:0;border-top:0}
.pgroup.zu .pghead{margin-bottom:0}
.pgroup + .legend{margin-top:1.4rem}
.pgbtn{display:flex;width:100%;align-items:baseline;gap:.55rem;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:.15rem 0;cursor:pointer;border-radius:.4rem}
.pgchev{flex:none;width:1.1em;color:var(--accent-text)}
.pgbtn .muted{font-weight:400;font-size:.9rem}
.pack{--sub:220;display:flex;flex-direction:column}
.pack .row{gap:.5rem}
.pack .row .btn:not(.sm){padding:.55rem 1rem}
.pk-head{display:flex;gap:.9rem;align-items:flex-start;margin-bottom:.3rem}

<script>
'use strict';
/* ========== Hilfsfunktionen ========== */
const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const inl = s => {
  const codes = [];

    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

};
/* Codeblock: eine Zeile ```r (mit Kopieren-Knopf) oder ```out (Ausgabe, ohne Knopf), darunter der Code, abschließend eine Zeile ```. */
const CODE_LABEL = { r: 'R-Code', out: 'Ausgabe in der Konsole', text: 'Text' };

  return s.split(/\n{2,}/).filter(par => par.trim() !== '').map(par => {
    const bm = /^\u0004(\d+)\u0005$/.exec(par.trim());
    if (bm) return codeBlockHtml(blocks[+bm[1]][0], blocks[+bm[1]][1]);
    const lines = par.split('\n');
    if (lines.every(l => /^\s*[-•]\s+/.test(l))) return '<ul>' + lines.map(l => '<li>' + inl(l.replace(/^\s*[-•]\s+/, '')) + '</li>').join('') + '</ul>';

}
const plain = s => String(s || '').replace(/\*\*/g, '').replace(/`/g, '').replace(/\s+/g, ' ').trim();
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
let toastTimer;

function dialog(html) { const d = $('#dlg'); d.innerHTML = '<div class="dlg-in">' + html + '</div>'; if (!d.open) d.showModal(); }
function closeDialog() { const d = $('#dlg'); if (d.open) d.close(); }
const fmtDate = t => new Date(t).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });

/* ========== Personen ========== */
/* Wer die App nutzt. Weitere Person: einfach eine Zeile ergänzen (id klein und ohne Leerzeichen).
   Für eine eigene Farbe zusätzlich im CSS oben eine Zeile html[data-p=<id>] ergänzen.
   ordner = Ordner unter pakete/, aus denen die Person ihre Pakete aus dem Repo bekommt (Standard: der eigene).
   Ein Ordner, der zwei Personen gemeinsam gehört (hier pakete/joel-dario/), taucht bei beiden auf. */
const PERSONEN = [ /* farbe = Akzent, h = Farbton des „Raums“ (0–360) */
  { id: 'joel', name: 'Joel', art: 'kind', farbe: '#ffc233', h: 228, ordner: ['joel', 'joel-dario'] },
  { id: 'dario', name: 'Dario', art: 'kind', farbe: '#b794ff', h: 268, ordner: ['dario', 'joel-dario'] },
  { id: 'saskia', name: 'Saskia', art: 'erwachsen', farbe: '#2fd0b9', h: 176 }
];
const ALT_BESITZER = 'joel'; /* ihm gehört der Speicherstand aus der Zeit vor den Profilen (lernhilfe.v1) */
const personById = id => PERSONEN.find(x => x.id === id);
const fold = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
let cur = null; /* gewählte Person, null = Startseite „Wer lernt?“ */
const wort = () => cur && cur.art === 'erwachsen' ? { probe: 'Probeklausur', wie: 'wie in der Prüfung' } : { probe: 'Probearbeit', wie: 'wie in der Schule' };
const klasseChip = k => /^\d+[a-z]?$/i.test(String(k).trim()) ? 'Klasse ' + k : String(k);

/* ========== Design: Hell/Dunkel, Fächer ========== */
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const b = $('#themeBtn'); if (!b) return;
  b.innerHTML = t === 'dark' ? ICON_SUN : ICON_MOON;
  b.setAttribute('aria-label', t === 'dark' ? 'Helles Design einschalten' : 'Dunkles Design einschalten');
  b.title = b.getAttribute('aria-label');
}
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('lernhilfe.theme', t); } catch (e) { /* nur diese Sitzung */ }
  applyTheme(t);
}
const FAECHER = [
  [/englisch|english/i, '💬', 265], [/geo(graf|grap)|erdkunde/i, '🌍', 150], [/musik/i, '🎵', 330], [/mathe/i, '🔢', 28],
  [/statistik|methoden/i, '📊', 195], [/psycholog/i, '🧠', 285], [/deutsch/i, '📖', 5], [/biolog|natur/i, '🌱', 120],
  [/chemie/i, '⚗️', 170], [/physik/i, '🔭', 215], [/geschichte/i, '🏛️', 40], [/kunst/i, '🎨', 315], [/sport/i, '⚽', 95], [/religion|ethik/i, '🕊️', 55]
];
function fachStil(f) {
  const s = String(f || ''), m = FAECHER.find(x => x[0].test(s));
  if (m) return { icon: m[1], hue: m[2] };
  let n = 0; for (const c of s) n = (n * 31 + c.charCodeAt(0)) % 360;
  return { icon: '📘', hue: s ? n : 220 };
}

/* ========== Speicher (getrennt pro Person) ========== */
const KEY_ALT = 'lernhilfe.v1';
const keyOf = id => 'lernhilfe.v2.' + id;
let db = null;
function readRaw(key) { try { const d = JSON.parse(localStorage.getItem(key) || 'null'); return d && typeof d === 'object' && !Array.isArray(d) ? d : null; } catch (e) { return null; } }
function loadDb(id) {
  let d = readRaw(keyOf(id)), migriert = false;
  if (!d && id === ALT_BESITZER) { d = readRaw(KEY_ALT); migriert = !!d; } /* alter Stand bleibt als Kopie unter lernhilfe.v1 liegen */
  const base = { pakete: [], ergebnisse: {}, session: null, gesichert: null };
  if (d) Object.assign(base, d);
  if (!Array.isArray(base.pakete)) base.pakete = [];
  if (!base.ergebnisse || typeof base.ergebnisse !== 'object') base.ergebnisse = {};
  if (base.session && (base.session.done || !base.pakete.some(p => p.id === base.session.id))) base.session = null;
  if (migriert) { try { localStorage.setItem(keyOf(id), JSON.stringify(base)); } catch (e) { /* wird beim nächsten Speichern erneut versucht */ } }
  return { base, migriert };
}
let saveTimer;
function save(now) {
  clearTimeout(saveTimer);
  if (!cur || !db) return;
  const key = keyOf(cur.id), data = db; /* Ziel jetzt festhalten, damit ein Personenwechsel nichts vermischt */
  const run = () => { try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) { toast('Speichern im Browser nicht möglich (Speicher voll oder gesperrt).'); } };
  if (now) run(); else saveTimer = setTimeout(run, 150);
}
function stopSpeech() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }
function enterPerson(p) {
  if (cur && cur.id === p.id) return;
  save(true); stopSpeech();
  const { base, migriert } = loadDb(p.id);
  cur = p; db = base;
  document.documentElement.dataset.p = p.id;
  if (migriert) toast('Die bisherigen Lernpakete und Ergebnisse sind jetzt bei ' + p.name + '.');
}
function leavePerson() {
  if (!cur) return;
  save(true); stopSpeech();
  cur = null; db = null; delete document.documentElement.dataset.p;
}
function peek(id) { /* für die Startseite: Pakete und letzte Übung einer Person */
  const d = readRaw(keyOf(id)) || (id === ALT_BESITZER ? readRaw(KEY_ALT) : null);
  if (!d) return { n: 0, last: 0 };
  let last = 0;
  Object.values(d.ergebnisse && typeof d.ergebnisse === 'object' ? d.ergebnisse : {}).forEach(a => (Array.isArray(a) ? a : []).forEach(r => { if (r && r.t > last) last = r.t; }));
  return { n: Array.isArray(d.pakete) ? d.pakete.length : 0, last };
}
const getPack = id => db.pakete.find(p => p.id === id);

/* ========== Lernpaket: Lücken, Prüfen, Punkte ========== */
const TYPES = ['mc', 'tf', 'kurz', 'luecke', 'zuordnen', 'reihenfolge', 'frei'];
function parseSegs(text) {
  const segs = []; const re = /\{\{([\s\S]*?)\}\}/g; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) segs.push({ k: 't', v: text.slice(last, m.index) });
    segs.push({ k: 'g', ans: m[1].split('|').map(s => s.trim()).filter(Boolean) });
    last = re.lastIndex;
  }
  if (last < text.length) segs.push({ k: 't', v: text.slice(last) });
  return segs;
}
const segCache = new WeakMap();
function segs(t) { let s = segCache.get(t); if (!s) { s = parseSegs(t.text || ''); segCache.set(t, s); } return s; }
const gapsOf = t => segs(t).filter(s => s.k === 'g');
function normText(s, t) {
  let x = String(s ?? '').normalize('NFC').replace(/[’‘`´]/g, "'").replace(/[“”„]/g, '"').replace(/ß/g, 'ss').replace(/\s+/g, ' ').trim();
  if (!(t && t.gross)) x = x.toLowerCase();
  return x.replace(/[.!?,;:]+$/, '').trim();
}
function toNum(s) { const x = String(s).trim().replace(',', '.'); return /^-?\d+(\.\d+)?$/.test(x) ? parseFloat(x) : null; }
/* Nachsicht (Aufgabenfeld "nachsicht": true) für Texteingaben: Artikel und Präpositionen am Anfang, Leerzeichen, Bindestriche und Punkte in Abkürzungen sowie Umlaut-Schreibweise (ae/ä) spielen keine Rolle,
   und bei Wörtern ab 6 Buchstaben ohne Ziffern wird ein Tippfehler verziehen (ein Buchstabe zu viel, zu wenig, falsch oder zwei Nachbarbuchstaben vertauscht). Zahlen und Jahre müssen stimmen. */
function nachsichtForm(s) {
  return normText(s, {}).replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
    .replace(/^(?:der|die|das|den|dem|des|ein|eine|einen|einem|einer|im|in|aus|zum|zur|nach|von)\s+/, '')
    .replace(/(?<=\p{L})\./gu, '').replace(/[\s\-‐–_\/]+/g, '');
}
function einTippfehler(a, b) {
  if (a === b) return true;
  const la = a.length, lb = b.length; if (Math.abs(la - lb) > 1) return false;
  let i = 0; while (i < la && i < lb && a[i] === b[i]) i++;
  if (la === lb) return a.slice(i + 1) === b.slice(i + 1) || (a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2));
  return la > lb ? a.slice(i + 1) === b.slice(i) : b.slice(i + 1) === a.slice(i);
}
function matches(input, expected, t) {
  const n = normText(input, t); if (!n) return false;
  const exp = [].concat(expected);
  if (exp.some(e => {
    if (normText(e, t) === n) return true;
    const a = toNum(input), b = toNum(e);
    return a !== null && b !== null && Math.abs(a - b) <= (t.toleranz || 0);
  })) return true;
  if (t.nachsicht && !t.gross) {
    const x = nachsichtForm(input); if (!x) return false;
    return exp.some(e => { const y = nachsichtForm(e); return y === x || (y.length >= 6 && !/\d/.test(y) && einTippfehler(x, y)); });
  }
  return false;
}
function maxPoints(t) {
  switch (t.typ) {
    case 'luecke': return gapsOf(t).length;
    case 'zuordnen': return t.paare.length;
    case 'frei': return t.punkte || 2;
    default: return t.punkte || 1;
  }
}
function evaluate(t, a, touched = true) {
  const max = maxPoints(t); let got = 0, parts = null;
  switch (t.typ) {
    case 'mc': {
      const exp = [].concat(t.richtig).map(Number).sort((x, y) => x - y);
      const sel = (a || []).slice().sort((x, y) => x - y);
      if (Array.isArray(t.richtig)) { /* mehrere richtige: richtige Kreuze minus falsche Kreuze */
        const right = sel.filter(x => exp.includes(x)).length, wrong = sel.length - right;
        got = max * Math.max(0, right - wrong) / exp.length;
      } else got = sel.length && JSON.stringify(sel) === JSON.stringify(exp) ? max : 0;
      break;
    }
    case 'tf': got = a === t.richtig ? max : 0; break;
    case 'kurz': got = matches(a || '', t.richtig, t) ? max : 0; break;
    case 'luecke': parts = gapsOf(t).map((g, i) => matches((a && a[i]) || '', g.ans, t)); got = parts.filter(Boolean).length; break;
    case 'zuordnen': parts = t.paare.map((p, i) => normText((a && a[i]) || '', t) === normText(p[1], t)); got = parts.filter(Boolean).length; break;
    case 'reihenfolge': {
      const n = t.schritte.length;
      parts = (a || []).map((v, i) => touched && v === i);
      got = touched && a && a.length === n ? max * parts.filter(Boolean).length / n : 0; break;
    }
    case 'frei': got = 0; break;
  }
  return { got, max, parts };
}
function isAnswered(t, s, idx) {
  const a = s.answers[idx];
  switch (t.typ) {
    case 'mc': return !!(a && a.length);
    case 'tf': return a === true || a === false;
    case 'kurz': case 'frei': return !!(a && a.trim());
    case 'luecke': case 'zuordnen': return !!(a && a.some(x => x && String(x).trim()));
    case 'reihenfolge': return !!s.touched[idx];
  }
  return false;
}
function taskScore(pack, s, idx) {
  const t = pack.aufgaben[idx];
  if (t.typ === 'frei') { const max = maxPoints(t); const v = s.self[idx]; return { got: (v || 0) * max, max, parts: null, rated: v !== undefined }; }
  const r = evaluate(t, s.answers[idx], s.touched[idx]); r.rated = true; return r;
}

/* ========== Validierung & Import ========== */
function validateTask(t, i, e) {
  const w = 'Aufgabe ' + (i + 1) + (t && t.typ ? ' (' + t.typ + ')' : '') + ': ';
  if (!t || typeof t !== 'object') { e.push(w + 'kein Objekt.'); return; }
  if (!TYPES.includes(t.typ)) { e.push(w + 'unbekannter Typ "' + t.typ + '". Erlaubt: ' + TYPES.join(', ') + '.'); return; }
  if (typeof t.frage !== 'string' || !t.frage.trim()) e.push(w + '"frage" fehlt.');
  switch (t.typ) {
    case 'mc':
      if (!Array.isArray(t.antworten) || t.antworten.length < 2) e.push(w + '"antworten" braucht mindestens 2 Einträge.');
      else { const r = [].concat(t.richtig); if (t.richtig === undefined || !r.length || r.some(x => !Number.isInteger(x) || x < 0 || x >= t.antworten.length)) e.push(w + '"richtig" muss die Nummer (ab 0) einer Antwort sein oder eine Liste solcher Nummern.'); }
      break;
    case 'tf': if (typeof t.richtig !== 'boolean') e.push(w + '"richtig" muss true oder false sein.'); break;
    case 'kurz': { const r = [].concat(t.richtig); if (t.richtig === undefined || !r.length || r.some(x => (typeof x !== 'string' && typeof x !== 'number') || String(x).trim() === '')) e.push(w + '"richtig" fehlt (Text oder Liste möglicher Texte).'); break; }
    case 'luecke':
      if (typeof t.text !== 'string' || !/\{\{[\s\S]+?\}\}/.test(t.text)) e.push(w + '"text" braucht mindestens eine Lücke im Format {{Antwort}} oder {{Antwort|Alternative}}.');
      else {
        const g = parseSegs(t.text).filter(s => s.k === 'g');
        g.forEach((x, n) => { if (!x.ans.length) e.push(w + 'Lücke ' + (n + 1) + ' ist leer.'); });
        if (t.wortbank !== undefined && (!Array.isArray(t.wortbank) || t.wortbank.some(x => typeof x !== 'string' || !x.trim()))) e.push(w + '"wortbank" muss eine Liste von Wörtern sein.');
        if (t.auswahl !== undefined) {
          if (!Array.isArray(t.auswahl) || t.auswahl.length < 2) e.push(w + '"auswahl" muss eine Liste mit mindestens 2 Wörtern sein.');
          else g.forEach((x, n) => { if (x.ans.length && !x.ans.some(a => t.auswahl.includes(a))) e.push(w + 'Lücke ' + (n + 1) + ' ("' + x.ans[0] + '") kommt nicht in "auswahl" vor.'); });
        }
      }
      break;
    case 'zuordnen':
      if (!Array.isArray(t.paare) || t.paare.length < 2 || !t.paare.every(p => Array.isArray(p) && p.length === 2 && p.every(x => typeof x === 'string' && x.trim()))) e.push(w + '"paare" braucht mindestens 2 Paare der Form ["links","rechts"].');
      break;
    case 'reihenfolge':
      if (!Array.isArray(t.schritte) || t.schritte.length < 2 || !t.schritte.every(x => typeof x === 'string' && x.trim())) e.push(w + '"schritte" braucht mindestens 2 Texte in der richtigen Reihenfolge.');
      break;
    case 'frei': if (typeof t.muster !== 'string' || !t.muster.trim()) e.push(w + '"muster" (Musterlösung) fehlt.'); break;
  }
  if (t.vorlesen !== undefined && (!t.vorlesen || typeof t.vorlesen.text !== 'string' || !t.vorlesen.text.trim())) e.push(w + '"vorlesen" braucht {"text": "...", "sprache": "en-GB"}.');
  if (t.bild !== undefined && typeof t.bild !== 'string') e.push(w + '"bild" muss ein Text sein (SVG-Code oder Bilddatei).');
}
function lesenErrs(r, p, w, e) { /* Verweise auf Lernblatt-Abschnitte prüfen (Abschnitte anderer Pakete lassen sich hier nicht prüfen) */
  [].concat(r).forEach(x => {
    if (typeof x === 'string') { if (!x.trim() || !(p.lernblatt || []).some(sec => sec.titel === x)) e.push(w + 'Der Abschnitt „' + x + '“ steht nicht im Lernblatt dieses Pakets.'); }
    else if (!x || typeof x.paket !== 'string' || typeof x.titel !== 'string') e.push(w + 'Ein Verweis ist ein Abschnittstitel oder {"paket": "...", "titel": "..."}.');
  });
}
function validatePack(p) {
  const e = [];
  if (!p || typeof p !== 'object' || Array.isArray(p)) return ['Kein Lernpaket (ein Objekt mit "typ": "lernpaket" wird erwartet).'];

/* ========== Ergebnis ========== */
function totals(p, s) {

}
function saveResult() {

  const e = { t: s.resultT, modus: s.modus, teil: !!s.teil, got: +tt.got.toFixed(2), max: tt.max };
  const k = arr.findIndex(x => x.t === s.resultT);
  if (k >= 0) arr[k] = e; else arr.push(e);

}
function finish() {

    if (open && !confirm('Du hast noch ' + open + (open === 1 ? ' Aufgabe' : ' Aufgaben') + ' ohne Antwort. Trotzdem abgeben?')) return;

  if (pct >= 50) return 'Auf dem richtigen Weg. Die markierten Aufgaben lohnen sich noch einmal.';

function resultRows(p, s) {

    const full = r.got >= r.max;

    if (t.info && t.typ !== 'frei') body += `<p>💡 ${inl(t.info)}</p>`;

    return `<details class="rrow st-${st}" ${full && r.rated ? '' : 'open'}><summary><span class="badge">${badge}</span><span class="t">${n + 1}. ${esc(title.slice(0, 90))}</span><span class="pts">${+r.got.toFixed(1)}/${r.max}</span></summary><div class="body">${body}</div></details>`;

/* ========== Sicherung, Bibliothek ========== */

let libItems = [];

/* Abgeschlossene Themen liegen im Repo in pakete/<ordner>/abgeschlossen/<thema>/ und stehen in der index.json als „abgeschlossen/<thema>/<datei>.json“. */
function renderLib() {

async function openLibrary() {

  }
}

/* ========== Lücken: Wörter ziehen oder antippen ========== */
let actGap = null, drag = null;
function eingabe() { try { return localStorage.getItem('lernhilfe.eingabe') === 'tippen' ? 'tippen' : 'ziehen'; } catch (err) { return 'ziehen'; } }
const kannZiehen = t => !!(t.wortbank && !t.auswahl); /* Lücken mit Wortbank: Wörter ziehen (Maus oder Touch) oder antippen */
const dragMode = t => kannZiehen(t) && eingabe() === 'ziehen';
function bankWords(t) { const out = []; const add = w => { if (w && !out.includes(w)) out.push(w); }; (t.wortbank || []).forEach(add); gapsOf(t).forEach(g => add(g.ans[0])); return out; }
function redrawAnswer() { const { s, idx, t } = curTask(); $('#ans').innerHTML = answerHtml(t, idx, s, false); updatePrimary(); save(); }
function gapValues() { const { s, idx, t } = curTask(); const a = s.answers[idx] = s.answers[idx] || []; for (let i = 0; i < gapsOf(t).length; i++) if (a[i] === undefined) a[i] = ''; return a; }
function nextEmptyGap(from) { const a = gapValues(); const n = a.length; for (let k = 0; k < n; k++) { const i = (from + k) % n; if (!a[i]) return i; } return null; }
function putWord(w, i) { const a = gapValues(); if (i === null || i === undefined) i = actGap !== null ? actGap : nextEmptyGap(0); if (i === null || i === undefined) return; a[i] = w; actGap = null; redrawAnswer(); }
function tapGap(i) { const a = gapValues(); if (a[i]) { a[i] = ''; actGap = i; } else actGap = actGap === i ? null : i; redrawAnswer(); }
function dropOnGap(src, j) {
  const a = gapValues();
  if (src.k === 'wc') { a[j] = src.w; actGap = null; }
  else if (src.i !== j) { const tmp = a[j]; a[j] = a[src.i]; a[src.i] = tmp; actGap = null; }
  redrawAnswer();
}
function endDrag() { if (!drag) return; if (drag.ghost) drag.ghost.remove(); $$('.gap.over').forEach(x => x.classList.remove('over')); window.removeEventListener('pointermove', onDragMove); window.removeEventListener('pointerup', onDragEnd); window.removeEventListener('pointercancel', onDragCancel); drag = null; }
function dragTarget(x, y) { const el = document.elementFromPoint(x, y); const g = el && el.closest && el.closest('button.gap.drop'); return g && !g.disabled ? g : null; }
function onDragMove(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  if (drag.tapOnly) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7) return;
    drag.moved = true; const g = document.createElement('div'); g.className = 'wghost'; g.textContent = drag.w; document.body.appendChild(g); drag.ghost = g;
  }
  e.preventDefault();
  const off = e.pointerType === 'touch' ? 44 : 0, px = e.clientX, py = e.clientY - off;
  drag.ghost.style.left = px + 'px'; drag.ghost.style.top = py + 'px';
  const tg = dragTarget(px, py); $$('.gap.over').forEach(x => x.classList.remove('over')); if (tg) tg.classList.add('over');
  if (e.clientY < 70) window.scrollBy(0, -10); else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 10);
}
function onDragEnd(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag; const off = e.pointerType === 'touch' ? 44 : 0; const tg = d.moved ? dragTarget(e.clientX, e.clientY - off) : null;
  endDrag();
  if (!d.moved) { if (d.k === 'wc') putWord(d.w); else tapGap(d.i); }
  else if (tg) dropOnGap(d, +tg.dataset.i);
  else if (d.k === 'dz') { const a = gapValues(); a[d.i] = ''; actGap = d.i; redrawAnswer(); }
}
function onDragCancel() { endDrag(); }
document.addEventListener('pointerdown', e => {
  const el = e.target.closest && e.target.closest('button[data-k=wc], button[data-k=dz]');
  if (!el || el.disabled || (e.pointerType === 'mouse' && e.button !== 0) || drag) return;
  const k = el.dataset.k; let w;
  if (k === 'wc') w = el.dataset.w; else { w = (gapValues()[+el.dataset.i]) || ''; }
  drag = { k, w, i: k === 'dz' ? +el.dataset.i : null, x0: e.clientX, y0: e.clientY, pid: e.pointerId, moved: false, ghost: null };
  if (k === 'dz' && !w) drag.tapOnly = true; /* leere Lücke: nur Antippen, kein Ziehen */
  window.addEventListener('pointermove', onDragMove, { passive: false }); window.addEventListener('pointerup', onDragEnd); window.addEventListener('pointercancel', onDragCancel);
  if (e.pointerType !== 'mouse') e.preventDefault();
});
document.addEventListener('click', e => { /* Tastatur: Enter oder Leertaste auf Wort oder Lücke */
  if (e.detail !== 0) return;
  const el = e.target.closest && e.target.closest('button[data-k=wc], button[data-k=dz]'); if (!el || el.disabled) return;
  if (el.dataset.k === 'wc') putWord(el.dataset.w); else tapGap(+el.dataset.i);
});
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.wchip, button.gap.drop')) e.preventDefault(); });

/* ========== Klicks & Tastatur ========== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (!db && act !== 'person' && act !== 'home' && act !== 'wechseln' && act !== 'theme') return; /* auf der Startseite „Wer lernt?“ gibt es nur die Auswahl */
  const sess = db && db.session;
  switch (act) {
    case 'theme': toggleTheme(); break;
    case 'copycode': { const c = el.closest('.codewrap'); const txt = c ? c.querySelector('code').textContent : ''; const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (err) { /* nicht möglich */ } ta.remove(); toast(ok ? 'Code kopiert.' : 'Kopieren nicht möglich – Code markieren und kopieren.'); }; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('Code kopiert.'), fallback); else fallback(); break; }
    case 'person': if (personById(id)) go('#/' + id); break;
    case 'wechseln': go('#/'); break;
    case 'home': go(cur ? H() : '#/'); break;
    case 'import': $('#file').click(); break;
    case 'paste': dialog('<h2>Lernpaket einfügen</h2><p class="muted">Den kompletten JSON-Text eines Lernpakets (oder einer Sicherung) hier einfügen.</p><textarea id="pasteTa" placeholder="{ &quot;typ&quot;: &quot;lernpaket&quot;, … }"></textarea><div class="row" style="margin-top:.8rem"><button class="btn" data-act="paste-go">Importieren</button><button class="btn ghost" data-act="dlg-close">Abbrechen</button></div>'); setTimeout(() => { const t = $('#pasteTa'); if (t) t.focus(); }, 50); break;
    case 'paste-go': { const v = $('#pasteTa').value.trim(); if (!v) return; closeDialog(); importText(v); break; }
    case 'library': openLibrary(); break;
    case 'lib-add': { const x = libItems[+el.dataset.i]; if (!x || x.errs.length) return; reportImport(importObj(JSON.parse(JSON.stringify(x.p)), x.f, true)); renderLib(); break; }
    case 'grp-toggle': { const g = el.dataset.g, zu = zuSet(); if (zu.has(g)) zu.delete(g); else zu.add(g); try { localStorage.setItem('lernhilfe.zu.' + cur.id, JSON.stringify([...zu])); } catch (err) { /* gilt dann nur für diese Sitzung */ } renderHome(); const nb = [...document.querySelectorAll('.pgbtn')].find(x => x.dataset.g === g); if (nb) nb.focus(); break; }
    case 'lib-toggle': { const g = el.dataset.g; if (libOffen.has(g)) libOffen.delete(g); else libOffen.add(g); renderLib(); break; }
    case 'dlg-close': closeDialog(); break;
    case 'backup': dialog('<h2>Sicherung für ' + esc(cur.name) + '</h2><p>Enthält alle importierten Lernpakete und die bisherigen Ergebnisse von ' + esc(cur.name) + '. Die Daten liegen sonst nur in diesem Browser.</p><div class="row"><button class="btn" data-act="backup-save">Als Datei speichern</button><button class="btn sec" data-act="backup-copy">Als Text kopieren</button><button class="btn sec" data-act="import">Wiederherstellen (Datei)</button><button class="btn ghost" data-act="dlg-close">Schließen</button></div>'); break;
    case 'backup-save': download('lernhilfe-sicherung-' + cur.id + '-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(backupData(), null, 1)); db.gesichert = Date.now(); save(true); toast('Sicherung gespeichert.'); break;
    case 'backup-copy': navigator.clipboard.writeText(JSON.stringify(backupData())).then(() => { db.gesichert = Date.now(); save(true); toast('Sicherung in die Zwischenablage kopiert.'); }, () => toast('Kopieren nicht möglich.')); break;
    case 'lernblatt': go(H('lernblatt/' + encodeURIComponent(id))); break;
    case 'ueben': case 'test': startSession(id, act === 'test' ? 'test' : 'ueben'); break;
    case 'del': { const p = getPack(id); if (p && confirm('„' + p.titel + '“ löschen? Die Ergebnisse bleiben gespeichert, falls du das Paket später wieder importierst.')) { db.pakete = db.pakete.filter(x => x.id !== id); if (sess && sess.id === id) db.session = null; save(true); render(); } break; }
    case 'resume': go(H('aufgabe')); break;
    case 'discard': if (confirm('Die laufende Sitzung verwerfen?')) { db.session = null; save(true); render(); } break;
    case 'quit': dialog('<h2>Sitzung beenden?</h2><p>Mit „Pause“ kannst du später genau hier weitermachen.</p><div class="row"><button class="btn" data-act="pause">Pause</button><button class="btn sec" data-act="discard-go">Verwerfen</button><button class="btn ghost" data-act="dlg-close">Weitermachen</button></div>'); break;
    case 'pause': closeDialog(); go(H()); break;
    case 'discard-go': db.session = null; save(true); closeDialog(); go(H()); break;
    case 'hint': { const { s, idx } = curTask(); s.hint[idx] = true; save(); renderTask(); break; }
    case 'speak': { const { t } = curTask(); speak(t.vorlesen.text, t.vorlesen.sprache); break; }
    case 'stop': if ('speechSynthesis' in window) speechSynthesis.cancel(); break;
    case 'eingabe': { try { localStorage.setItem('lernhilfe.eingabe', eingabe() === 'ziehen' ? 'tippen' : 'ziehen'); } catch (err) { /* ohne Speicher gilt die Standardeinstellung */ } actGap = null; redrawAnswer(); break; }
    case 'up': moveStep(+el.dataset.pos, -1); break;
    case 'down': moveStep(+el.dataset.pos, 1); break;
    case 'check': { const { s, idx } = curTask(); s.checked[idx] = true; save(); renderTask(true); break; }
    case 'next': { const { s } = curTask(); if (s.pos < s.order.length - 1) { s.pos++; save(); renderTask(); window.scrollTo(0, 0); } break; }
    case 'prev': { const { s } = curTask(); if (s.pos > 0) { s.pos--; save(); renderTask(); window.scrollTo(0, 0); } break; }
    case 'jump': { const { s } = curTask(); s.pos = +el.dataset.p; save(); renderTask(); break; }
    case 'finish': finish(); break;
    case 'self': { const { s, idx } = curTask(); s.self[idx] = parseFloat(el.dataset.v); save(); renderTask(true); break; }
    case 'self-r': { const s = db.session; s.self[+el.dataset.i] = parseFloat(el.dataset.v); saveResult(); const keep = $$('details.rrow').map(d => d.open); const y = window.scrollY; renderResult(); $$('details.rrow').forEach((d, i) => { d.open = keep[i]; }); window.scrollTo(0, y); break; }
    case 'retry-wrong': { const { s, p } = curTask(); const wrong = s.order.filter(i => { const r = taskScore(p, s, i); return r.got < r.max && p.aufgaben[i].typ !== 'frei'; }); db.session = null; startSession(s.id, 'ueben', wrong); break; }
    case 'again': { const { s } = curTask(); const id2 = s.id, m = s.modus; db.session = null; startSession(id2, m); break; }
    case 'finish-home': db.session = null; save(true); go(H()); break;
  }
});
window.addEventListener('pagehide', () => save(true));
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const el = e.target;
  if (el.tagName === 'INPUT' && el.type === 'text' && el.closest('.task')) { const b = $('#primary'); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
  if (el.tagName === 'TEXTAREA' && (e.ctrlKey || e.metaKey) && el.closest('.task')) { const b = $('#primary'); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
});
$('#file').addEventListener('change', e => { const f = Array.from(e.target.files); e.target.value = ''; closeDialog(); if (f.length) importFiles(f); });
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) closeDialog(); });
let dragDepth = 0;
window.addEventListener('dragenter', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) { dragDepth++; document.body.classList.add('dropping'); } });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dropping'); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dropping'); const f = Array.from(e.dataTransfer.files || []).filter(x => /\.json$/i.test(x.name)); if (f.length) importFiles(f); });

/* ========== Vorlesen ========== */
function speak(text, lang) {
  if (!('speechSynthesis' in window)) { toast('Dein Browser kann nicht vorlesen. Öffne „Text zum Vorlesen“ für die Eltern.'); return; }
  const ss = window.speechSynthesis; ss.cancel();
  const u = new SpeechSynthesisUtterance(text); const l = lang || 'en-GB'; u.lang = l; u.rate = 0.88;
  const vs = ss.getVoices();
  const v = vs.find(x => x.lang.replace('_', '-').toLowerCase() === l.toLowerCase()) || vs.find(x => x.lang.toLowerCase().startsWith(l.slice(0, 2).toLowerCase()));
  if (v) u.voice = v; ss.speak(u);
}

applyTheme(document.documentElement.dataset.theme || 'dark');
render();
</script>
