<style>
/* Designsystem: Jede Person hat ihren eigenen „Raum“ (Farbton + Akzent). Neutrale Flächen leiten sich aus --h ab. */
:root{--h:228;--bg:hsl(var(--h) 34% 8%);--chrome:hsl(var(--h) 32% 10%);--surface:hsl(var(--h) 27% 13%);--surface-2:hsl(var(--h) 25% 18%);--line:hsl(var(--h) 21% 25%);--ink:hsl(var(--h) 50% 96%);--muted:hsl(var(--h) 16% 71%);--accent:#ffc233;--accent-text:#ffc233;--on-accent:#1d1500;--ok:#3ccf82;--bad:#ff7d72;--part:#f3b43f;--shadow:0 18px 40px -18px rgba(2,4,14,.85);--display:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Inter Display",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
html[data-p=saskia]{--h:176;--accent:#2fd0b9;--accent-text:#2fd0b9;--on-accent:#03201b}
html[data-p=dario]{--h:268;--accent:#b794ff;--accent-text:#b794ff;--on-accent:#1b0f38}
html[data-theme=light]{color-scheme:light;--bg:hsl(var(--h) 38% 96%);--chrome:#fff;--surface:#fff;--surface-2:hsl(var(--h) 36% 95%);--line:hsl(var(--h) 24% 86%);--ink:hsl(var(--h) 42% 12%);--muted:hsl(var(--h) 12% 38%);--accent-text:#7d5000;--ok:#117a47;--bad:#c1372b;--part:#8f5b00;--shadow:0 16px 36px -18px hsl(var(--h) 40% 25% / .35)}
html[data-theme=light][data-p=saskia]{--accent-text:#09665b}
html[data-theme=light][data-p=dario]{--accent-text:#5a2fb3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}

ul,ol{margin:.3rem 0 .8rem;padding-left:1.3rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.col{max-width:780px;margin:0 auto}
.muted{color:var(--muted)}
.center{text-align:center}

.btn{font:inherit;font-weight:650;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:.62rem 1.15rem;border-radius:10px;cursor:pointer;transition:filter .12s,border-color .12s,background .12s}

.resume{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.legend{font-size:.85rem;color:var(--muted)}

.segs i.ok,.segs i.cur.ok{background:var(--ok)}

.sect{font-size:.9rem;font-weight:700;color:var(--accent-text);margin-bottom:.35rem}

.listen{margin:0 0 1rem}
.listen .row{margin-bottom:.4rem}
.script{font-size:.92rem;background:var(--surface-2);border-radius:10px;padding:.4rem .8rem}
.script summary{cursor:pointer;color:var(--muted)}
.opts{display:grid;gap:.55rem}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;gap:.85rem;align-items:center;padding:.75rem .95rem;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 65%,var(--line))}

.ltr{flex:none;width:2rem;height:2rem;border-radius:9px;display:grid;place-items:center;font:700 .95rem/1 var(--display);background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.opt:has(input:checked) .ltr{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:#06210f}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad);color:#2a0a07}
.opt.miss{border-color:var(--ok);border-style:dashed;background:var(--surface)}
.hintline{color:var(--muted);font-size:.9rem;margin:0 0 .5rem}

.kurz{display:flex;align-items:center;gap:.6rem}

.area{width:100%;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);resize:vertical}
.txt:focus,.area:focus{border-color:var(--accent);outline:none}
.unit{color:var(--muted)}
.gaptext{font-size:1.1rem;line-height:2.5}

.bank.live{gap:.55rem;margin:.9rem 0 .3rem;padding:.7rem;border:1px dashed var(--line);border-radius:12px}
.wchip{font:inherit;font-size:1.05rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:.45rem .9rem;min-height:2.75rem;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.modeline{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:.2rem}
.ok{border-color:var(--ok)!important}
strong.bad{color:var(--bad)}
.bad{border-color:var(--bad)!important}
input.ok,select.ok,.gap.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
input.bad,select.bad,.gap.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.pairs{display:grid;gap:.5rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;align-items:center}
.sel{padding:.5rem .6rem;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);width:100%}
.order{list-style:none;padding:0;margin:0;display:grid;gap:.5rem;counter-reset:o}
.order li{counter-increment:o;display:flex;align-items:center;gap:.7rem;border:1.5px solid var(--line);border-radius:12px;padding:.5rem .8rem;background:var(--surface)}

.order li.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}

.mv{display:flex;gap:.3rem}
.mini{font:inherit;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;width:2.2rem;height:2rem;cursor:pointer}

.fb{margin-top:1rem;border-radius:12px;padding:.8rem 1rem;border:1.5px solid var(--line)}
.fb.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.fb.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:var(--bad)}

.fb h3{font-size:1.05rem;margin:0 0 .3rem}
.fb p{margin:.3rem 0}
.fill{background:color-mix(in srgb,var(--ok) 20%,transparent);border-radius:5px;padding:0 .3rem}

.nav{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.3rem;align-items:center}

.dot.done{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.dot.cur{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.score{display:flex;flex-direction:column;align-items:center;text-align:center;padding:1.8rem 1.4rem}

.tm-days{flex:none;min-width:4.2rem;padding:.5rem .6rem;border-radius:12px;background:var(--accent);color:var(--on-accent);text-align:center;line-height:1.1}

.tm-segs .seg.done{background:var(--ok)}
.tm-next{margin:.8rem 0 0}
.tm-next .row{margin-top:.55rem}
.tm-lbl{font-size:.85rem;font-weight:700;color:var(--accent-text)}
.chip.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pack.next{border-color:var(--accent)}
.teile{padding:.4rem 1.35rem}
.teil{padding:.85rem 0;border-bottom:1px solid var(--line)}
.teil:last-child{border-bottom:0}

.teil .tn{font-weight:650;min-width:0}

.teil .bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.teil .tf{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.55rem}
.teil.weak .tn{color:var(--bad)}
details.rrow{border:1px solid var(--line);border-radius:12px;margin:0 0 .6rem;background:var(--surface)}

details.rrow .body{padding:.2rem 1rem 1rem}

.st-ok .badge{color:var(--ok)}.st-bad .badge{color:var(--bad)}.st-part .badge{color:var(--part)}
.pts{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.kv{margin:.3rem 0}
.kv b{display:inline-block;min-width:8.5rem;color:var(--muted);font-weight:650}
dialog{border:1px solid var(--line);border-radius:20px;padding:0;background:var(--surface);color:var(--ink);max-width:min(640px,94vw);width:100%;box-shadow:var(--shadow)}

.errs{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-radius:10px;padding:.5rem .9rem;font-size:.92rem}

.codewrap{margin:.6rem 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}

.codebar .codecopy{min-height:0;padding:.25rem .7rem}

.libgrp{margin-top:1.2rem}

const inl = s => {
  const codes = [];
  const h = esc(s).replace(/`([^`\n]+)`/g, (m, c) => '\u0002' + (codes.push(c) - 1) + '\u0003')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  return h.replace(/\u0002(\d+)\u0003/g, (m, i) => '<code>' + codes[i] + '</code>');
};
/* Codeblock: eine Zeile ```r (mit Kopieren-Knopf) oder ```out (Ausgabe, ohne Knopf), darunter der Code, abschließend eine Zeile ```. */
const CODE_LABEL = { r: 'R-Code', out: 'Ausgabe in der Konsole', text: 'Text' };
function codeBlockHtml(lang, code) {
  const l = (lang || 'r').trim().toLowerCase();
  const copy = l !== 'out' && l !== 'text';

    const bm = /^\u0004(\d+)\u0005$/.exec(par.trim());

    const c = document.createElement('canvas'); c.id = 'konf'; c.setAttribute('aria-hidden', 'true');
    const W = c.width = window.innerWidth, Hh = c.height = window.innerHeight; document.body.appendChild(c);
    const rosa = cur && cur.id === 'saskia'; /* Saskia: rosa Glitzer mit funkelnden Sternchen */
    const x = c.getContext('2d'), farben = rosa ? ['#ff5cb8', '#ff8fd0', '#ffb3e0', '#f08cff', '#ffd1ec', '#ffffff', '#ff3fa4'] : ['#ffc233', '#3ccf82', '#ff7d72', '#59d0f5', '#b794ff', '#ffffff'];
    const ps = Array.from({ length: rosa ? 150 : 120 }, (_, n) => ({ x: W * (0.25 + Math.random() * 0.5), y: Hh * 0.4, vx: (Math.random() - 0.5) * 12, vy: -7 - Math.random() * 9, w: 5 + Math.random() * 6, h: 3 + Math.random() * 5, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, ph: Math.random() * 6.28, stern: rosa && n % 3 === 0, c: farben[Math.floor(Math.random() * farben.length)] }));

        } else { x.rotate(q.r); x.fillStyle = q.c; x.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); }

      if (el < DAUER) requestAnimationFrame(loop); else c.remove();

  } catch (err) { /* nur Zierde */ }
}

/* ----- PeerJS nachladen (nur wenn gebraucht, wie in der Quiz-App) ----- */
let peerLib = null;
function peerLaden() {
  if (window.Peer) return Promise.resolve();
  if (peerLib) return peerLib;
  peerLib = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = PEER_URL; sc.async = true;
    const fail = why => { clearTimeout(tm); sc.remove(); peerLib = null; rej(new Error(why)); };
    const tm = setTimeout(() => fail('zeit'), 12000);
    sc.onload = () => { if (window.Peer) { clearTimeout(tm); res(); } else fail('leer'); };
    sc.onerror = () => fail('laden');
    document.head.appendChild(sc);
  });
  return peerLib;
}

/* ----- Senden (Kinder-Gerät) ----- */

  const raw = readRaw(keyOf(pid)); if (!raw) return;
  raw.eltern = Object.assign({}, raw.eltern, werte);

}

async function openLibrary() {
  const who = cur, ordner = who.ordner || [who.id];
  dialog('<h2>Pakete aus dem Repo</h2><p>Lade …</p>');
  try {
    const items = [], seen = new Set();
    for (const dir of ordner) {
      const base = 'pakete/' + dir + '/';
      const r = await fetch(base + 'index.json', { cache: 'no-store' });
      let list = [];
      if (r.status !== 404) { if (!r.ok) throw new Error('HTTP ' + r.status); list = await r.json(); } /* kein Ordner = noch keine Pakete */
      if (!Array.isArray(list)) throw new Error('index.json in ' + dir + ' ist keine Liste');
      for (const f of list) {
        if (typeof f !== 'string' || !/^(?:[\w\-.]+\/)*[\w\- .]+\.json$/.test(f) || f.split('/').some(t => t === '.' || t === '..')) continue; /* Unterordner wie abgeschlossen/geografie/… sind erlaubt */
        try { const rr = await fetch(base + f.split('/').map(encodeURIComponent).join('/'), { cache: 'no-store' }); const p = await rr.json(); if (p && seen.has(p.id)) continue; if (p) seen.add(p.id); items.push({ f, p, errs: validatePack(p) }); }
        catch (e) { items.push({ f, p: null, errs: ['Datei nicht lesbar'] }); }
      }
    }
    if (cur !== who) return; /* zwischendurch die Person gewechselt */
    libItems = items; renderLib();
  } catch (e) {
    if (cur !== who) return;
    dialog('<h2>Pakete aus dem Repo</h2><p>Die Paketliste konnte nicht geladen werden (' + esc(e.message) + ').</p><p class="muted">Das klappt nur, wenn die App über GitHub Pages oder einen Webserver geöffnet wird, nicht direkt als Datei vom Computer. Importieren per Datei funktioniert immer.</p><div class="row"><button class="btn" data-act="dlg-close">OK</button></div>');
  }
}

/* ========== Lücken: Wörter ziehen oder antippen ========== */

document.addEventListener('pointerdown', e => {

document.addEventListener('click', e => { /* Tastatur: Enter oder Leertaste auf Wort oder Lücke */

/* ========== Klicks & Tastatur ========== */

    case 'paste-go': { const v = $('#pasteTa').value.trim(); if (!v) return; closeDialog(); importText(v); break; }

    case 'grp-toggle': { const g = el.dataset.g, zu = zuSet(); if (zu.has(g)) zu.delete(g); else zu.add(g); try { localStorage.setItem('lernhilfe.zu.' + cur.id, JSON.stringify([...zu])); } catch (err) { /* gilt dann nur für diese Sitzung */ } renderHome(); const nb = [...document.querySelectorAll('.pgbtn')].find(x => x.dataset.g === g); if (nb) nb.focus(); break; }

/* ========== Vorlesen ========== */
function speak(text, lang) {
  if (!('speechSynthesis' in window)) { toast('Dein Browser kann nicht vorlesen. Öffne „Text zum Vorlesen“ für die Eltern.'); return; }
  const ss = window.speechSynthesis; ss.cancel();
  const u = new SpeechSynthesisUtterance(text); const l = lang || 'en-GB'; u.lang = l; u.rate = 0.88;
  const vs = ss.getVoices();
  const v = vs.find(x => x.lang.replace('_', '-').toLowerCase() === l.toLowerCase()) || vs.find(x => x.lang.toLowerCase().startsWith(l.slice(0, 2).toLowerCase()));
  if (v) u.voice = v; ss.speak(u);
}
